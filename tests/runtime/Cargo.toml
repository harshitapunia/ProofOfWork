[package]
name = "proof-of-work-runtime-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Isolated host-only LiteSVM harness for the reviewed ProofOfWork SBF artifact"

# Intentionally separate from the production workspace and lockfile.
[workspace]
resolver = "2"

[dependencies]
litesvm = { version = "=0.18.2", default-features = false }
agave-feature-set = "=4.3.2"
solana-account = "=4.7.0"
solana-address = { version = "=2.7.0", features = ["std", "curve25519"] }
solana-instruction = "=3.5.1"
solana-message = "=4.6.0"
solana-transaction = { version = "=4.3.0", features = ["serde"] }
solana-sdk-ids = "=3.1.0"
sha2 = "=0.10.9"

serde_json = "=1.0.154"
bincode = "=1.3.3"
